schema: oversold.expect/v1
description: >
  Known Medusa bugs next to their controls. Each bug case must still fail its
  check and each control must still pass every check.
runs: 3
cases:
  - scenario: scenarios/medusa/single-cart-over-demand.yaml
    note: "#16502"
    expect:
      no_oversell: fail_every_run
      reserved_matches_reservations: pass_every_run
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
  - scenario: scenarios/medusa/normal-checkout.yaml
    note: "control for #16502"
    expect:
      no_oversell: pass_every_run
      reserved_matches_reservations: pass_every_run
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
  - scenario: scenarios/medusa/last-unit-two-servers.yaml
    note: "#17032"
    expect:
      no_oversell: fail_at_least_once
      reserved_matches_reservations: fail_at_least_once
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
  - scenario: scenarios/medusa/last-unit-one-server.yaml
    note: "control for #17032"
    expect:
      no_oversell: pass_every_run
      reserved_matches_reservations: pass_every_run
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
  - scenario: scenarios/medusa/counter-two-servers.yaml
    note: "#17032"
    expect:
      no_oversell: pass_every_run
      reserved_matches_reservations: fail_at_least_once
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
  - scenario: scenarios/medusa/counter-one-server.yaml
    note: "control for #17032"
    expect:
      no_oversell: pass_every_run
      reserved_matches_reservations: pass_every_run
      one_order_per_cart: pass_every_run
      no_orphaned_orders: pass_every_run
