schema: oversold.scenario/v1
name: normal-checkout-two-servers-redis-locking
description: >
  Control. Copy of normal-checkout-two-servers with both servers on Medusa's
  Redis locking provider, which Medusa recommends when more than one server
  runs. Every other module stays in-memory. The same cart is built on server 1
  and completed on server 2, and both servers share one database. Medusa's
  rules expect one order and 4 units reserved.
target:
  engine: medusa
  version: 2.21.2
  servers: 2
  locking: redis
stock:
  WIDGET: 10
carts:
  main:
    server: 1
    lines:
      - sku: OVS-PIECE
        qty: 2
      - sku: OVS-TWOPACK
        qty: 1
race:
  - id: complete-on-2
    server: 2
    do: complete
    cart: main
timing:
  release: sequential
faults: []
runs: 30
seed: 3
