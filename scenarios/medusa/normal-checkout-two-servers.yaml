schema: oversold.scenario/v1
name: normal-checkout-two-servers
description: >
  Same cart as normal-checkout, built on server 1 and completed on server 2.
  Both servers share one database.
target:
  engine: medusa
  version: 2.21.2
  servers: 2
stock:
  WIDGET: 10
carts:
  main:
    server: 1
    lines:
      - sku: OVS-PIECE
        qty: 2
      - sku: OVS-TWOPACK
        qty: 1
race:
  - id: complete-on-2
    server: 2
    do: complete
    cart: main
timing:
  release: sequential
faults: []
runs: 3
seed: 3
checks:
  - no_oversell
  - reserved_matches_reservations
  - one_order_per_cart
  - no_orphaned_orders
