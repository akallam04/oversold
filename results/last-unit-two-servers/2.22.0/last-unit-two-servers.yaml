schema: oversold.scenario/v1
name: last-unit-two-servers
description: >
  Targets Medusa issue #17032 across processes. One SOLO unit in stock. Cart a
  on server 1 and cart b on server 2 each hold OVS-SOLO 1 and are completed
  together, each on its own server. Medusa's rules expect exactly one order
  and the other completion rejected.
target:
  engine: medusa
  version: 2.21.2
  servers: 2
stock:
  SOLO: 1
carts:
  a:
    server: 1
    lines:
      - sku: OVS-SOLO
        qty: 1
  b:
    server: 2
    lines:
      - sku: OVS-SOLO
        qty: 1
race:
  - id: complete-a
    server: 1
    do: complete
    cart: a
  - id: complete-b
    server: 2
    do: complete
    cart: b
timing:
  release: together
faults: []
runs: 30
seed: 11
