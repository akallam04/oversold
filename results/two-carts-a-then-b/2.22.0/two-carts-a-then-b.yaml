schema: oversold.scenario/v1
name: two-carts-a-then-b
description: >
  Order control for two-carts-shared-stock (#17032). Cart a holds OVS-PIECE 5
  (5 WIDGET units). Cart b holds OVS-PIECE 3 and OVS-TWOPACK 2 (7 WIDGET
  units, on two lines). 10 WIDGET are in stock, so each cart fits on its own
  but together they need 12. Cart a is completed first and cart b only after
  a's response, on server 1. Medusa's rules expect a to complete and b to be
  rejected, since only 5 units are left for its 7.
target:
  engine: medusa
  version: 2.21.2
  servers: 1
stock:
  WIDGET: 10
carts:
  a:
    server: 1
    lines:
      - sku: OVS-PIECE
        qty: 5
  b:
    server: 1
    lines:
      - sku: OVS-PIECE
        qty: 3
      - sku: OVS-TWOPACK
        qty: 2
race:
  - id: complete-a
    server: 1
    do: complete
    cart: a
  - id: complete-b
    server: 1
    do: complete
    cart: b
timing:
  release: sequential
faults: []
runs: 30
seed: 8
