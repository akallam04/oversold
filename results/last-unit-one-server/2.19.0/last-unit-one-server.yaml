schema: oversold.scenario/v1
name: last-unit-one-server
description: >
  Control. One SOLO unit in stock. Carts a and b each hold OVS-SOLO 1, both on
  server 1, and are completed together. Medusa's rules expect exactly one
  order and the other completion rejected.
target:
  engine: medusa
  version: 2.21.2
  servers: 1
stock:
  SOLO: 1
carts:
  a:
    server: 1
    lines:
      - sku: OVS-SOLO
        qty: 1
  b:
    server: 1
    lines:
      - sku: OVS-SOLO
        qty: 1
race:
  - id: complete-a
    server: 1
    do: complete
    cart: a
  - id: complete-b
    server: 1
    do: complete
    cart: b
timing:
  release: together
faults: []
runs: 30
seed: 5
