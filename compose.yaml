name: oversold

x-medusa-env: &medusa-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medusa?sslmode=disable
  JWT_SECRET: ${MEDUSA_JWT_SECRET:?set MEDUSA_JWT_SECRET in .env}
  COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET:?set MEDUSA_COOKIE_SECRET in .env}
  STORE_CORS: http://localhost:${MEDUSA_PORT:-9000},http://localhost:${MEDUSA_2_PORT:-9001}
  ADMIN_CORS: http://localhost:${MEDUSA_PORT:-9000},http://localhost:${MEDUSA_2_PORT:-9001}
  AUTH_CORS: http://localhost:${MEDUSA_PORT:-9000},http://localhost:${MEDUSA_2_PORT:-9001}
  MEDUSA_DISABLE_TELEMETRY: "true"

x-medusa: &medusa
  image: ${OVERSOLD_IMAGE_PREFIX:-oversold-medusa}:${MEDUSA_VERSION:?set MEDUSA_VERSION in .env}
  pull_policy: never
  environment: *medusa-env

x-medusa-server: &medusa-server
  <<: *medusa
  depends_on:
    medusa-seed:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 10s

services:
  postgres:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./targets/medusa/db/create-database.sql:/docker-entrypoint-initdb.d/10-medusa.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  medusa-migrate:
    <<: *medusa
    pull_policy: build
    build:
      context: targets/medusa
      args:
        MEDUSA_VERSION: ${MEDUSA_VERSION:?set MEDUSA_VERSION in .env}
    command: ["node_modules/.bin/medusa", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  medusa-seed:
    <<: *medusa
    environment:
      <<: *medusa-env
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:?set MEDUSA_ADMIN_EMAIL in .env}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:?set MEDUSA_ADMIN_PASSWORD in .env}
    command: ["node_modules/.bin/medusa", "exec", "./src/scripts/seed.js"]
    restart: "no"
    depends_on:
      medusa-migrate:
        condition: service_completed_successfully

  medusa:
    <<: *medusa-server
    ports:
      - "127.0.0.1:${MEDUSA_PORT:-9000}:9000"

  medusa-2:
    <<: *medusa-server
    ports:
      - "127.0.0.1:${MEDUSA_2_PORT:-9001}:9000"
