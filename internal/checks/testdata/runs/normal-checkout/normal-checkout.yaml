schema: oversold.scenario/v1
name: normal-checkout
description: >
  One cart with OVS-PIECE 2 and OVS-TWOPACK 1 (4 WIDGET units) is completed once
  against 10 WIDGET in stock.
target:
  engine: medusa
  version: 2.21.2
  servers: 1
stock:
  WIDGET: 10
carts:
  main:
    server: 1
    lines:
      - sku: OVS-PIECE
        qty: 2
      - sku: OVS-TWOPACK
        qty: 1
race:
  - id: complete
    server: 1
    do: complete
    cart: main
timing:
  release: sequential
faults: []
runs: 3
seed: 1
checks:
  - no_oversell
  - reserved_matches_reservations
  - one_order_per_cart
  - no_orphaned_orders
